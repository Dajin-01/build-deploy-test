name: HTTP Echo Cloud Check

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  COMPOSE_FILE: compose.test.yaml
  COMPOSE_PROJECT_NAME: ito-echo-cloud-${{ github.run_id }}-${{ github.run_attempt }}
  # Keep the image tag stable when only a failed deploy job is re-run.
  CHECK_ID: cloud-${{ github.run_id }}
  BUILD_REVISION: ${{ github.sha }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check Docker and Compose configuration
        run: |
          docker info --format '{{.OSType}}'
          docker compose config --quiet

      - name: Build source and run Go checks
        run: docker compose build

      - name: Export Docker image
        run: docker image save --output "$RUNNER_TEMP/http-echo-image.tar" "ito-http-echo-check:$CHECK_ID"

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: http-echo-image
          path: ${{ runner.temp }}/http-echo-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: http-echo-image
          path: ${{ runner.temp }}

      - name: Load built Docker image
        run: docker image load --input "$RUNNER_TEMP/http-echo-image.tar"

      - name: Deploy test container
        run: docker compose up -d --no-build --pull never --wait --wait-timeout 60

      - name: Wait for health endpoint
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-connrefused --connect-timeout 2 --max-time 5 http://127.0.0.1:18080/health

      - name: Verify response and built revision
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import urlopen

          with urlopen('http://127.0.0.1:18080/health', timeout=10) as response:
              assert response.status == 200
              assert json.load(response) == {'status': 'ok'}
          with urlopen('http://127.0.0.1:18080/', timeout=10) as response:
              body = response.read().decode('utf-8').strip()
              revision = response.headers['X-App-Version']
              assert response.status == 200
              assert body == f"cicd-ok-{os.environ['CHECK_ID']}", 'Unexpected run response'
              assert revision == os.environ['BUILD_REVISION'], 'Unexpected built revision'
          summary = f'PASS: revision={revision} response={body}'
          print(summary)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
              output.write(summary + '\n')
          PY

      - name: Collect container logs
        if: always() && steps.checkout.outcome == 'success'
        run: docker compose logs --no-color --tail=100

      - name: Remove test container and network
        if: always() && steps.checkout.outcome == 'success'
        run: docker compose down --timeout 10
