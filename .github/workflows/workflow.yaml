name: HTTP Echo Build Deploy Check

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs that share the test port on this runner.
concurrency:
  group: http-echo-internal-test
  cancel-in-progress: false

defaults:
  run:
    shell: powershell

env:
  COMPOSE_FILE: compose.test.yaml
  COMPOSE_PROJECT_NAME: ito-echo-${{ github.run_id }}-${{ github.run_attempt }}
  # Keep the image tag stable when only a failed deploy job is re-run.
  CHECK_ID: ${{ github.run_id }}
  BUILD_REVISION: ${{ github.sha }}

jobs:
  build:
    name: build
    runs-on: [self-hosted, windows, internal-test]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check Docker Linux engine
        run: |
          $engine = docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($engine.Trim() -ne 'linux') {
            throw 'Switch Docker Desktop to Linux containers.'
          }

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build source and run Go checks
        run: docker compose build

      - name: Export Docker image
        run: docker image save --output (Join-Path $env:RUNNER_TEMP 'http-echo-image.tar') "ito-http-echo-check:$env:CHECK_ID"

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: http-echo-image
          path: ${{ runner.temp }}/http-echo-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

  deploy:
    name: deploy
    needs: build
    runs-on: [self-hosted, windows, internal-test]
    timeout-minutes: 10
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check Docker Linux engine
        run: |
          $engine = docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($engine.Trim() -ne 'linux') {
            throw 'Switch Docker Desktop to Linux containers.'
          }

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: http-echo-image
          path: ${{ runner.temp }}

      - name: Load built Docker image
        run: docker image load --input (Join-Path $env:RUNNER_TEMP 'http-echo-image.tar')

      - name: Deploy test container
        run: docker compose up -d --no-build --pull never --wait --wait-timeout 60

      - name: Wait for health endpoint
        run: |
          curl.exe --fail --silent --show-error --retry 12 --retry-delay 2 --retry-connrefused --connect-timeout 2 --max-time 5 http://127.0.0.1:18080/health
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify response and built revision
        run: |
          $response = Invoke-WebRequest -Uri 'http://127.0.0.1:18080/' -UseBasicParsing -TimeoutSec 10
          if ($response.StatusCode -ne 200) { throw 'Unexpected HTTP status.' }
          if ($response.Content.Trim() -ne "cicd-ok-$env:CHECK_ID") {
            throw 'Response does not belong to this workflow run.'
          }
          if ($response.Headers['X-App-Version'] -ne $env:BUILD_REVISION) {
            throw 'Running binary does not match the checked-out commit.'
          }
          $summary = "PASS: revision=$env:BUILD_REVISION response=$($response.Content.Trim())"
          Write-Output $summary
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Collect container logs
        if: always() && steps.checkout.outcome == 'success'
        run: docker compose logs --no-color --tail=100

      - name: Remove test container and network
        if: always() && steps.checkout.outcome == 'success'
        run: docker compose down --timeout 10
